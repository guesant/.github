name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug]: "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Do not include passwords, tokens, private keys, personal information,
        or other sensitive data.

        Security vulnerabilities must be reported according to SECURITY.md
        instead of through a public issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent report.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, operating system, runtime, browser, or other environment information.
      placeholder: |
        Version:
        Operating system:
        Runtime:
        Browser:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant logs or error messages. Remove secrets and sensitive information first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, minimal reproductions, links, or other useful context.
    validations:
      required: false
