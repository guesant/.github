name: Feature request
description: Propose a concrete improvement or new capability
title: "[Feature]: "

body:
  - type: markdown
    attributes:
      value: |
        Feature requests should describe the problem being solved,
        not only a preferred implementation.

        For early-stage ideas that still need exploration, consider using
        GitHub Discussions when it is enabled.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar proposals.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this change address?
      placeholder: Describe the use case and why the current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or capability you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives, workarounds, or different approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, screenshots, or other relevant information.
    validations:
      required: false